services:
  app:
    build:
      context: .
    container_name: schoolar_app
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - public_build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: schoolar_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - public_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: schoolar_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: schoolar
      MYSQL_USER: schoolar
      MYSQL_PASSWORD: schoolar
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  jenkins:
    build:
      context: ./docker/jenkins
    container_name: schoolar_jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./:/workspace/schoolar
    depends_on:
      - app

volumes:
  jenkins_home:
  mysql_data:
  public_build:
  vendor:
